<!--
  Haushaltsplaner Version 2.70
  Diese Version korrigiert die Datenmigration aus älteren Versionen:
  die Beta 0.33 speicherte übernommene Daten versehentlich unter
  einem falschen Schlüssel, sodass vorhandene Töpfe nicht übernommen
  wurden. Beim erstmaligen Laden einer Beta 0.34 Installation werden
  vorhandene Daten aus früheren States korrekt übernommen und unter
  dem neuen Schlüssel gespeichert.

  Außerdem zeigt das Menü „Töpfe“ nun auch ohne vorhandene Töpfe eine
  sinnvolle Übersicht über den Spar‑Plan. Der Bereich „Sichern &
  Exportieren“ ist wieder vollständig nutzbar.
-->
<!--
  Aktualisierung Version&nbsp;2.70: Riverty S.19 erlaubt nur die vereinbarte
  Rate oder die vollständige Gesamtforderung. Nach jeder Aktualisierung eines
  Schuldenstands werden der 800-Euro-Plan und alle Vorschläge sofort neu
  berechnet.
  Version&nbsp;2.69: Bevor das zusätzliche Schuldenbudget auf
  mehrere Vorschläge verteilt wird, prüft die Anwendung zuerst, ob damit eine
  geeignete Schuld vollständig bezahlt werden kann.
  Version&nbsp;2.68: Ab September 2026 gilt ein festes
  Schuldenziel von 800&nbsp;€ pro Monat. Die Anwendung berücksichtigt zuerst
  alle Standardraten und schlägt dann unabhängig vom freien Haushaltsbetrag
  eine sinnvolle Ratenerhöhung oder Zusatztilgung vor. Zahlungsbeschränkungen
  und bereits bezahlte Beträge werden automatisch beachtet.
  Version&nbsp;2.67: Taskrabbit-Auszahlungen werden bei der Eingabe
  direkt in Lohn, Material und Trinkgeld aufgeteilt. Der Gesamtbetrag wird
  automatisch berechnet und sofort im Haushalt berücksichtigt; EÜR-Liste, CSV
  und PDF zeigen daraus eine einzige Jahressumme. Einzelne Auszahlungen bleiben
  als interner Nachweis bearbeitbar.
  Version&nbsp;2.66: Überwiesene Betriebseinnahmen und -ausgaben
  verändern den gesamten verfügbaren Betrag automatisch. Barzahlungen bleiben
  vollständig in der EÜR, werden im Haushaltsbudget aber nicht eingerechnet.
  Version&nbsp;2.65: Neue Betriebsausgaben können automatisch
  als bezahlte „Sonstige Ausgabe“ übernommen werden. Barzahlung und Überweisung
  werden in Buchungen, EÜR-Bericht und CSV-Ausgabe festgehalten, ohne Ausgaben
  doppelt vom verfügbaren Betrag abzuziehen.
  Version&nbsp;2.64: Regelmäßige gemeinsame und persönliche
  Kosten werden automatisch als Vertragsvorschläge erkannt. Verknüpfte Schulden
  und Budgettöpfe werden ausgelassen; andere Vorschläge lassen sich als
  „Kein Vertrag“ ausblenden.
  Version&nbsp;2.63: Verträge können mit Kosten, Laufzeit,
  Kündigungsfrist und Prüfintervall verwaltet werden. Fristen werden automatisch
  berechnet und auf der Übersicht angezeigt.
  Version&nbsp;2.62: Monat und Jahr sind in der Seitenleiste
  übersichtlicher aufgeteilt und verzichten auf unnötige Zusatztexte.
  Version&nbsp;2.61: Auf dem PC scrollt die linke Seitenleiste als
  Ganzes, sodass sie über ihre gesamte Fläche mit dem Mausrad bedienbar ist.
  Version&nbsp;2.60: Die Monatsübersicht in der Seitenleiste zeigt
  freie, gemeinsame und persönliche Beträge in klaren, gut lesbaren Zeilen.
  Version&nbsp;2.59: Die Oberfläche erhält eine ruhige, sachliche
  Finanz-Optik mit weniger Effekten, klareren Tabellen und einer kompakteren
  Navigation. Funktionen und lokale Daten bleiben unverändert.
-->
